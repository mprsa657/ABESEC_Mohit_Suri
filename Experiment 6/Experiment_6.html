<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy</title>
  <style>
    body {
  background-color: #f5f7fc;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

.container {
  border: 1px solid #000;
  width: 95%;
  margin: 20px auto;
  background: #fff;
}

header {
  background-color: #222;
  color: #fff;
  text-align: center;
  padding: 10px;
}

header h1 {
  margin: 0;
  font-size: 1.5rem;
}

.product-card {
  background-color: #f8f9fd;
  width: 380px;
  margin: 30px auto;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  overflow: hidden;
  border: 1px solid #e0e0e0;
}

.product-card img {
  width: 100%;
  display: block;
}

.product-info {
  padding: 10px 15px;
}

.product-info h3 {
  font-size: 15px;
  margin: 5px 0;
  font-weight: bold;
}

.product-info p {
  font-size: 13px;
  color: #555;
  margin: 5px 0 10px;
}

.price {
  margin-bottom: 10px;
}

.new-price {
  color: #008000;
  font-weight: bold;
  font-size: 14px;
}

.old-price {
  color: #999;
  text-decoration: line-through;
  font-size: 13px;
  margin-left: 5px;
}

button {
  background-color: #007bff;
  color: #fff;
  border: none;
  width: 100%;
  padding: 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
}

  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ShopEasy</h1>
    </header>
</div>
    <div class="product-card">
      <div class="product-info">
              <img src="a_exp6.png">
        <h3>Classic Cotton T-Shirt</h3>
        <p>Soft, breathable cotton. Regular fit. Available in multiple colors.</p>
        <div class="price">
          <span class="new-price">₹799</span>
          <span class="old-price">₹1,199</span>
        </div>
        <button>Add to Cart</button>
      </div>
    </div>
<pre style="text-align:center">

Class : CSE-21 </pre>
</body>
</html>
